name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://phd:placeholder@localhost:5432/phd_hub
          DEV_AUTH_BYPASS: "false"
          ALLOWED_USER: theo


  quartz-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Quartz folder and note rewrites without redirects
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quartz-html/PhD"
          printf '<!doctype html><title>Knowledge</title>' > "$RUNNER_TEMP/quartz-html/index.html"
          printf '<!doctype html><title>PhD</title>' > "$RUNNER_TEMP/quartz-html/PhD/index.html"
          printf '<!doctype html><title>Example</title>' > "$RUNNER_TEMP/quartz-html/PhD/example.html"
          printf 'body{color:white}' > "$RUNNER_TEMP/quartz-html/index.css"
          docker run -d --rm --name quartz-nginx-test \
            -p 127.0.0.1:18080:80 \
            -v "$PWD/infrastructure/nginx-quartz.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/quartz-html:/usr/share/nginx/html/knowledge:ro" \
            nginx:1.27-alpine
          trap 'docker rm -f quartz-nginx-test >/dev/null 2>&1 || true' EXIT
          docker exec quartz-nginx-test nginx -t
          for path in /knowledge/ /knowledge/PhD /knowledge/PhD/ /knowledge/PhD/index.html /knowledge/PhD/example /knowledge/index.css; do
            code="$(curl -sS --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path")"
            echo "$path => $code"
            test "$code" = 200 || exit 1
          done

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check private HTTPS routes
        run: |
          set -euo pipefail
          for path in / /journal /calendar /repositories /tasks /experiments /api/journal /knowledge/; do
            headers="$(mktemp)"
            code="$(curl --silent --show-error --retry 2 --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' "https://phd.les12.fr$path")"
            echo "$path => $code"
            case "$code" in
              301|302|303|307|308)
                grep -qi '^location:.*auth.les12.fr' "$headers" || { echo 'Expected Authelia redirect'; exit 1; }
                ;;
              401|403) ;;
              *) echo "Unexpected unauthenticated response: $code"; exit 1 ;;
            esac
            rm -f "$headers"
          done

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phd
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: phd_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phd -d phd_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://phd:test-password@localhost:5432/phd_hub?schema=public
      NODE_ENV: development
      DEV_AUTH_BYPASS: "false"
      ALLOWED_USER: tester
      OBSIDIAN_DAILY_DIR: /tmp/phd-test-daily
      VIKUNJA_URL: http://127.0.0.1:3999
      VIKUNJA_TOKEN: test-token
      MLFLOW_URL: http://127.0.0.1:3999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Start mock integrations and app
        run: |
          mkdir -p /tmp/phd-test-daily/Daily\ Notes
          printf -- "---\\ntitle: Reconstruction notes\\n---\\n## Results\\nMSE improved.\\n" > "/tmp/phd-test-daily/Daily Notes/2026-11-20.md"
          node tests/mock-providers.mjs > /tmp/mock-providers.log 2>&1 &
          npm run dev -- -p 3100 > /tmp/phd-web.log 2>&1 &
      - name: Test authenticated APIs, database and adapters
        run: node tests/integration.mjs
      - name: Show server logs on failure
        if: failure()
        run: |
          tail -n 120 /tmp/phd-web.log || true
          tail -n 100 /tmp/mock-providers.log || true
