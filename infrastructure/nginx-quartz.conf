server {
  listen 80;
  server_name _;
  # Never redirect clients to the upstream Docker hostname (phd-quartz).
  absolute_redirect off;
  root /usr/share/nginx/html;
  location = /knowledge { return 301 /knowledge/; }
  location /knowledge/ {
    # Next.js external rewrites may remove a folder's trailing slash before
    # proxying to nginx. Serve its index directly instead of issuing a 301,
    # which would otherwise loop or reveal the private Docker hostname.
    try_files $uri $uri/index.html $uri.html =404;
  }
}
