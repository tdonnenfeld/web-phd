name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://phd:placeholder@localhost:5432/phd_hub
          DEV_AUTH_BYPASS: "false"
          ALLOWED_USER: theo
